# Modern Python .pre-commit-config.yaml
# Production quality stack: Ruff, Bandit, validate-pyproject, and git hygiene.
# Adapted from mapkit/mskit standard configuration.

minimum_pre_commit_version: "3.2.0"
default_install_hook_types:
  - pre-commit
  - pre-push
default_stages:
  - pre-commit

repos:
  # 1. Standard Git & File Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude: ^(docs/|tests/fixtures/)
      - id: end-of-file-fixer
        exclude: ^(docs/|tests/fixtures/)
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: debug-statements
      - id: check-docstring-first
      - id: mixed-line-ending
      - id: detect-private-key

  # 2. Ruff - Ultra-Fast Python Linter and Formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # 3. Security Checks with Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|scripts/|bench/)

  # 4. Pyproject Configuration Integrity
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.23
    hooks:
      - id: validate-pyproject

  # 5. Local Git Diff & Fast Invariant Gate
  - repo: local
    hooks:
      - id: git-diff-check
        name: git diff whitespace check
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-fast
        name: targeted pytest suite (pre-push)
        entry: uv run pytest -n 4 -m "not slow"
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
