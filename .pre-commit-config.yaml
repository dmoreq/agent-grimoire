# .pre-commit-config.yaml
# Precept repository pre-commit and pre-push hooks
# Enforces formatting, file hygiene, and invariant test coverage

minimum_pre_commit_version: "3.2.0"
default_install_hook_types:
  - pre-commit
  - pre-push
default_stages:
  - pre-commit

repos:
  # 1. Standard Git & File Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude: ^(dist/|docs/)
      - id: end-of-file-fixer
        exclude: ^(dist/|docs/)
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: detect-private-key

  # 2. Python Linting & Formatting for Tests and Scripts
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(tests/|skills/.*/scripts/).*\.py$
      - id: ruff-format
        files: ^(tests/|skills/.*/scripts/).*\.py$

  # 3. Local Diff Checks & Pre-push Invariant Suite
  - repo: local
    hooks:
      - id: git-diff-check
        name: git diff whitespace check
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-invariants
        name: pytest invariant test suite (pre-push)
        entry: pytest -n 4
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
